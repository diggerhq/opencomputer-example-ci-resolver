name: fixture

on:
  push:
    branches: [fixture-ci]
  pull_request:
    branches: [fixture-ci]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: |
          set -o pipefail
          cd fixture && npm test 2>&1 | tee "$RUNNER_TEMP/test.log"
      # On a failed push, hand the job to the resolver. Pull requests are not
      # reported, so the resolver's own pull requests never re-trigger it.
      - name: Report the failure to the resolver
        if: failure() && github.event_name == 'push'
        env:
          OC_WEBHOOK_URL: ${{ secrets.OC_WEBHOOK_URL }}
          OC_WEBHOOK_TOKEN: ${{ secrets.OC_WEBHOOK_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          JOB: ${{ github.workflow }} / ${{ github.job }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node -e '
            const fs = require("fs");
            const log = fs.readFileSync(process.env.RUNNER_TEMP + "/test.log", "utf8").split("\n").slice(-80).join("\n");
            const { REPOSITORY, REF, SHA, JOB, RUN_URL } = process.env;
            process.stdout.write(JSON.stringify({
              text: `CI failed: ${JOB} on ${REF}. Fix it and open a pull request.`,
              payload: { repository: REPOSITORY, ref: REF, sha: SHA, job: JOB, run: RUN_URL, log },
            }));
          ' > "$RUNNER_TEMP/report.json"
          curl -fsS -X POST "$OC_WEBHOOK_URL" \
            -H "Authorization: Bearer $OC_WEBHOOK_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: ${{ github.run_id }}" \
            --data-binary @"$RUNNER_TEMP/report.json"
